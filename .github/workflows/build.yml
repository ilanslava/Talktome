name: Build TalkToMe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unpack and build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Unpack app archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -f TKM.zip ]; then
            unzip -q TKM.zip -d app
          else
            echo "::error::TKM.zip was not found in the repository root."
            exit 1
          fi

      - name: Install dependencies and build (when Node project is present)
        id: node_build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_JSON="$(find app -name package.json -not -path '*/node_modules/*' -print -quit)"

          if [ -n "$PACKAGE_JSON" ]; then
            PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            cd "$PROJECT_DIR"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
              if [ -d dist ]; then
                BUILD_DIR=dist
              elif [ -d build ]; then
                BUILD_DIR=build
              elif [ -d out ]; then
                BUILD_DIR=out
              else
                echo "::error::Build ran, but no dist/, build/, or out/ directory was found."
                exit 1
              fi
              mkdir -p "$GITHUB_WORKSPACE/artifact"
              cp -a "$BUILD_DIR/." "$GITHUB_WORKSPACE/artifact/"
            else
              echo "No build script found; packaging the project files as a static app."
              mkdir -p "$GITHUB_WORKSPACE/artifact"
              cp -a . "$GITHUB_WORKSPACE/artifact/"
              rm -rf "$GITHUB_WORKSPACE/artifact/node_modules"
            fi
          else
            echo "No package.json found; checking for a static HTML app."
            HTML_FILE="$(find app -name index.html -print -quit)"
            if [ -z "$HTML_FILE" ]; then
              echo "::error::No package.json or index.html was found inside TKM.zip."
              exit 1
            fi
            HTML_DIR="$(dirname "$HTML_FILE")"
            mkdir -p "$GITHUB_WORKSPACE/artifact"
            cp -a "$HTML_DIR/." "$GITHUB_WORKSPACE/artifact/"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: talktome-build
          path: artifact/
          if-no-files-found: error
          retention-days: 14

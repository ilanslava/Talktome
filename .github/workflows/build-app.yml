name: Build TalkToMe App

on:
  push:
    branches: [main]
    paths:
      - "TKM.zip"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract TKM project
        shell: bash
        run: |
          set -euo pipefail
          test -f TKM.zip || { echo "::error::TKM.zip was not found in the repository root."; exit 1; }
          mkdir -p source
          unzip -q TKM.zip -d source

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find an Android Gradle project with an app module inside TKM.zip."
            echo "Files found in the archive:"
            find source -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkToMe-Android-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build TalkToMe Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f TKM.zip || { echo "::error::TKM.zip não encontrado na raiz do repositório."; exit 1; }
          mkdir -p source
          unzip -q TKM.zip -d source
          test -f source/TalkToMe/settings.gradle.kts || { echo "::error::Estrutura Android esperada não encontrada em TKM.zip."; exit 1; }

      - name: Build debug APK
        working-directory: source/TalkToMe
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TalkToMe-Android-APK
          path: source/TalkToMe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
